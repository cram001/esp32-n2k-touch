[platformio]
default_envs = waveshare-touch-4

[env:waveshare-touch-4]
platform = espressif32@7.1.3
# PlatformIO has no dedicated Waveshare ESP32-S3-Touch-LCD-4 board manifest.
# The generic S3 target is intentional; flash/PSRAM/partition details are
# overridden below and in sdkconfig.defaults.
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
lib_ldf_mode = deep+
lib_deps =
    https://github.com/ttlappalainen/NMEA2000.git
build_flags =
    -std=gnu++17
