[platformio]
default_envs = waveshare-touch-4

[env:waveshare-touch-4]
platform = espressif32
# PlatformIO has no dedicated Waveshare ESP32-S3-Touch-LCD-4 board manifest.\n# Use the generic S3 target; flash/PSRAM/partition details are overridden by sdkconfig.defaults and this environment.\nboard = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
