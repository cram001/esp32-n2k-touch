name: PlatformIO Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Test settings migration and Wi-Fi credential validation
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/host -I src src/app_settings.cpp src/wifi_config.cpp tests/host/settings_test.cpp -o /tmp/settings_test
          /tmp/settings_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src tests/host/victron_discovery_test.cpp -o /tmp/victron_discovery_test
          /tmp/victron_discovery_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/ble -I tests/host -I src tests/host/smartshunt_discovery_test.cpp -o /tmp/smartshunt_discovery_test
          /tmp/smartshunt_discovery_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/wifi -I tests/host -I src src/wifi_config.cpp tests/host/wifi_service_test.cpp -o /tmp/wifi_service_test
          /tmp/wifi_service_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/instrument -I tests/host -I src src/instrument_data.cpp src/n2k_sources.cpp tests/host/nvs_fake.cpp tests/host/heading_test.cpp -o /tmp/heading_test
          /tmp/heading_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/instrument -I tests/host -I src tests/host/sources_test.cpp tests/host/nvs_fake.cpp -o /tmp/sources_test
          /tmp/sources_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/instrument -I tests/host -I src src/instrument_data.cpp src/n2k_sources.cpp tests/host/nvs_fake.cpp tests/host/format_test.cpp -o /tmp/format_test
          /tmp/format_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src src/n2k_waypoints.cpp tests/host/waypoints_test.cpp -o /tmp/waypoints_test
          /tmp/waypoints_test
          g++ -std=c++17 -Wall -Wextra -I src src/actisense_ascii.cpp tests/host/actisense_test.cpp -o /tmp/actisense_test
          /tmp/actisense_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/gateway -I src src/n2k_input.cpp src/actisense_ascii.cpp tests/host/n2k_input_test.cpp -o /tmp/n2k_input_test
          /tmp/n2k_input_test

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Validate OTA partitions, rollback and firmware integrity
        run: python tools/validate_release.py --test

      - name: Test actual NMEA2000 library PGNs through the gateway decoder
        shell: bash
        run: |
          lib=.pio/libdeps/waveshare-touch-4/NMEA2000-library/src
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/instrument -I tests/host -I src -I "$lib" src/n2k_sources.cpp src/n2k_instruments.cpp src/n2k_waypoints.cpp src/actisense_ascii.cpp "$lib/N2kMsg.cpp" "$lib/N2kMessages.cpp" "$lib/N2kStream.cpp" tests/host/nvs_fake.cpp tests/host/instruments_test.cpp -o /tmp/instruments_test
          /tmp/instruments_test

      - name: Reject unknown Kconfig symbols
        if: always()
        shell: bash
        run: |
          if grep -Eqi 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log; then
            echo "::error::ESP-IDF reported an unknown or unrecognized Kconfig symbol."
            grep -Ein 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log
            exit 1
          fi
