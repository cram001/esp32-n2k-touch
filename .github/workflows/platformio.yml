name: PlatformIO Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Reject unknown Kconfig symbols
        if: always()
        shell: bash
        run: |
          if grep -Eqi 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log; then
            echo "::error::ESP-IDF reported an unknown or unrecognized Kconfig symbol."
            grep -Ein 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log
            exit 1
          fi
