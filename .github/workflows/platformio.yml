name: PlatformIO Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platformio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Beta-0.4.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Test settings migration and Wi-Fi credential validation
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -I tests/host -I src src/app_settings.cpp src/wifi_config.cpp tests/host/settings_test.cpp -o /tmp/settings_test
          /tmp/settings_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src tests/host/victron_discovery_test.cpp -o /tmp/victron_discovery_test
          /tmp/victron_discovery_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/ble -I tests/host -I src tests/host/smartshunt_discovery_test.cpp -o /tmp/smartshunt_discovery_test
          /tmp/smartshunt_discovery_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/ble -I tests/host -I src tests/host/smartshunt_telemetry_test.cpp -lcrypto -o /tmp/smartshunt_telemetry_test
          /tmp/smartshunt_telemetry_test
          g++ -std=c++17 -Wall -Wextra -I src tests/host/tile_number_fit_test.cpp -o /tmp/tile_number_fit_test
          /tmp/tile_number_fit_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host -I src tests/host/depth_display_test.cpp -o /tmp/depth_display_test
          /tmp/depth_display_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/http -I tests/host -I src tests/host/local_http_server_test.cpp -o /tmp/local_http_server_test
          /tmp/local_http_server_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/wifi -I tests/host -I src src/wifi_config.cpp tests/host/wifi_service_test.cpp -o /tmp/wifi_service_test
          /tmp/wifi_service_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/instrument -I tests/host -I src src/instrument_data.cpp src/n2k_sources.cpp tests/host/nvs_fake.cpp tests/host/heading_test.cpp -o /tmp/heading_test
          /tmp/heading_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/instrument -I tests/host -I src tests/host/sources_test.cpp tests/host/nvs_fake.cpp -o /tmp/sources_test
          /tmp/sources_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/instrument -I tests/host -I src src/instrument_data.cpp src/n2k_sources.cpp tests/host/nvs_fake.cpp tests/host/format_test.cpp -o /tmp/format_test
          /tmp/format_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I src src/n2k_waypoints.cpp tests/host/waypoints_test.cpp -o /tmp/waypoints_test
          /tmp/waypoints_test
          g++ -std=c++17 -Wall -Wextra -I src src/actisense_ascii.cpp tests/host/actisense_test.cpp -o /tmp/actisense_test
          /tmp/actisense_test
          g++ -std=c++17 -Wall -Wextra -I tests/host/gateway -I src src/n2k_input.cpp src/actisense_ascii.cpp tests/host/n2k_input_test.cpp -o /tmp/n2k_input_test
          /tmp/n2k_input_test

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Validate OTA partitions, rollback and firmware integrity
        run: python tools/validate_release.py --test

      - name: Test actual NMEA2000 library PGNs through the gateway decoder
        shell: bash
        run: |
          lib=.pio/libdeps/waveshare-touch-4/NMEA2000-library/src
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/instrument -I tests/host -I src -I "$lib" src/n2k_sources.cpp src/n2k_instruments.cpp src/n2k_waypoints.cpp src/actisense_ascii.cpp "$lib/N2kMsg.cpp" "$lib/N2kMessages.cpp" "$lib/N2kStream.cpp" tests/host/nvs_fake.cpp tests/host/instruments_test.cpp -o /tmp/instruments_test
          /tmp/instruments_test
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I tests/host/instrument -I tests/host -I src -I "$lib" src/instrument_data.cpp src/n2k_sources.cpp src/n2k_instruments.cpp src/n2k_waypoints.cpp "$lib/N2kMsg.cpp" "$lib/N2kMessages.cpp" "$lib/N2kStream.cpp" tests/host/nvs_fake.cpp tests/host/sog_test.cpp -o /tmp/sog_test
          /tmp/sog_test

      - name: Reject unknown Kconfig symbols
        if: always()
        shell: bash
        run: |
          if grep -Eqi 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log; then
            echo "::error::ESP-IDF reported an unknown or unrecognized Kconfig symbol."
            grep -Ein 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log
            exit 1
          fi

      - name: Package validated firmware artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          build=.pio/build/waveshare-touch-4
          mkdir -p firmware-artifact
          cp "$build/firmware.bin" firmware-artifact/
          cp "$build/firmware.elf" firmware-artifact/
          cp "$build"/*.map firmware-artifact/ 2>/dev/null || true
          "$HOME/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-addr2line" -pfiaCe "$build/firmware.elf" 0x420945eb 0x4208a79d 0x4208a962 0x4037d27d 0x4203c514 0x4203b7be 0x42118eb9 0x4203c6f7 0x4203c81c 0x4203c689 0x42040bbc 0x42041327 0x4203b9a3 0x42053f5b 0x4200dc71 0x4200ea4a 0x4200eeed 0x4204d7fd 0x4204d8ef 0x4203c70a 0x42048bb5 0x4204981b 0x42049b98 0x4204a63b 0x4204f012 0x4204f16d 0x4210133c > firmware-artifact/backtrace.txt
          cat firmware-artifact/backtrace.txt
          cp "$build/partitions.bin" firmware-artifact/
          cp "$build/bootloader.bin" firmware-artifact/ 2>/dev/null || true
          cp "$build/bootloader/bootloader.bin" firmware-artifact/ 2>/dev/null || true
          cp "$build/partition_table/partition-table.bin" firmware-artifact/ 2>/dev/null || true
          cp "$build"/ota_data_initial.bin firmware-artifact/ 2>/dev/null || true
          cp "$build"/flash_args firmware-artifact/ 2>/dev/null || true
          cp "$build"/flash_project_args firmware-artifact/ 2>/dev/null || true

          # Browser-friendly first-install/recovery image. This deliberately includes
          # bootloader, partition table, initial OTA metadata and ota_0 application.
          # Flash the merged file at address 0x0; it is not an in-place settings-preserving update.
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            -o firmware-artifact/esp32-n2k-touch-full.bin \
            0x0 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xf000 "$build/ota_data_initial.bin" \
            0x20000 "$build/firmware.bin"

          printf '%s\n' "${{ github.sha }}" > firmware-artifact/commit.txt
          sha256sum firmware-artifact/*.bin > firmware-artifact/SHA256SUMS.txt

      - name: Upload validated firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-touch-4-firmware
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 14
