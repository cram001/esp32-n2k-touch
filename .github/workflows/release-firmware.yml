name: Publish firmware release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run 2>&1 | tee build.log

      - name: Validate release image
        run: python tools/validate_release.py --test

      - name: Reject unknown Kconfig symbols
        shell: bash
        run: |
          if grep -Eqi 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log; then
            echo "::error::ESP-IDF reported an unknown or unrecognized Kconfig symbol."
            grep -Ein 'not found in any of the input files|unknown[[:space:]_-]+kconfig[[:space:]_-]+symbol|unrecognized[[:space:]_-]+symbol' build.log
            exit 1
          fi

      - name: Prepare downloadable firmware
        shell: bash
        run: |
          set -euo pipefail
          build=.pio/build/waveshare-touch-4
          mkdir -p release-assets

          cp "$build/firmware.bin" release-assets/firmware.bin

          # One-file first-install/recovery image for ESPConnect.
          # Includes bootloader, partition table, initial OTA metadata and ota_0 app.
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            -o release-assets/esp32-n2k-touch-full.bin \
            0x0 "$build/bootloader.bin" \
            0x8000 "$build/partitions.bin" \
            0xf000 "$build/ota_data_initial.bin" \
            0x20000 "$build/firmware.bin"

          printf '%s\n' "${{ github.sha }}" > release-assets/commit.txt
          sha256sum release-assets/*.bin > release-assets/SHA256SUMS.txt

      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-assets/esp32-n2k-touch-full.bin \
            release-assets/firmware.bin \
            release-assets/SHA256SUMS.txt \
            release-assets/commit.txt \
            --clobber
